<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'NDot57';
    src: url('ndot.otf') format('opentype');
  }
  @font-face {
    font-family: 'NType82';
    src: url('ntype.otf') format('opentype');
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    width: 1280px;
    height: 720px;
    background-color: #000000;
    color: #FFFFFF;
    font-family: 'NType82', sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 28px 48px 20px 48px;
    user-select: none;
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .title {
    font-family: 'NDot57', sans-serif;
    font-size: 26px;
    letter-spacing: 2px;
    color: #FFFFFF;
  }

  .sub {
    font-size: 13px;
    color: #888888;
    margin-top: 4px;
  }

  .clock {
    font-family: 'NDot57', sans-serif;
    font-size: 20px;
    color: #FFFFFF;
  }

  /* 2x4 GRID OF TOGGLES */
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 14px;
    height: 340px;
    margin-top: 24px;
  }

  .card {
    background: #141414;
    border: 1px solid #222222;
    border-radius: 16px;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card svg {
    width: 24px;
    height: 24px;
    fill: #CCCCCC;
  }

  .toggle-name {
    font-size: 14px;
    font-weight: 700;
    color: #FFFFFF;
  }

  .toggle-val {
    font-size: 12px;
    color: #888888;
    margin-top: 2px;
  }

  /* Focused Toggle: Wi-Fi */
  .card.focused {
    background: #FFFFFF;
    border: 1px solid #FFFFFF;
    transform: scale(1.02);
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
  }

  .card.focused svg {
    fill: #000000;
  }

  .card.focused .toggle-name {
    color: #000000;
  }

  .card.focused .toggle-val {
    color: #444444;
  }

  /* VOLUME & ALL SETTINGS ROW */
  .bottom-controls {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-top: 20px;
  }

  .volume-card {
    flex: 1;
    height: 48px;
    background: #141414;
    border: 1px solid #242424;
    border-radius: 24px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .volume-card svg {
    width: 20px;
    height: 20px;
    fill: #AAAAAA;
  }

  .volume-track {
    flex: 1;
    height: 6px;
    background: #282828;
    border-radius: 3px;
    position: relative;
  }

  .volume-fill {
    width: 32%;
    height: 100%;
    background: #D71920;
    border-radius: 3px;
  }

  .volume-num {
    font-family: 'NDot57', sans-serif;
    font-size: 16px;
    color: #FFFFFF;
  }

  .all-settings-btn {
    height: 48px;
    padding: 0 28px;
    background: #FFFFFF;
    color: #000000;
    font-size: 13px;
    font-weight: 700;
    border-radius: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  /* FOOTER */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    height: 20px;
    padding-top: 10px;
    border-top: 1px solid #141414;
  }

  .footer-hints {
    font-size: 10px;
    color: #555555;
    letter-spacing: 1px;
  }

  .footer-code {
    font-family: 'NDot57', sans-serif;
    font-size: 11px;
    color: #888888;
    letter-spacing: 1.5px;
  }
</style>
</head>
<body>

  <div>
    <div class="header">
      <div>
        <div class="title">QUICK SETTINGS</div>
        <div class="sub">The controls you reach for most.</div>
      </div>
      <div class="clock">21:50</div>
    </div>

    <!-- 2x4 Grid of Toggles -->
    <div class="grid">
      <!-- 1. Wi-Fi (Focused) -->
      <div class="card focused">
        <svg viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4z"/></svg>
        <div>
          <div class="toggle-name">Wi-Fi</div>
          <div class="toggle-val">Connected</div>
        </div>
      </div>

      <!-- 2. Bluetooth -->
      <div class="card">
        <svg viewBox="0 0 24 24"><path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/></svg>
        <div>
          <div class="toggle-name">Bluetooth</div>
          <div class="toggle-val">On</div>
        </div>
      </div>

      <!-- 3. Input -->
      <div class="card">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        <div>
          <div class="toggle-name">Input</div>
          <div class="toggle-val">HDMI 1</div>
        </div>
      </div>

      <!-- 4. Cast -->
      <div class="card">
        <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
        <div>
          <div class="toggle-name">Cast</div>
          <div class="toggle-val">Ready</div>
        </div>
      </div>

      <!-- 5. Picture Mode -->
      <div class="card">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <div>
          <div class="toggle-name">Picture Mode</div>
          <div class="toggle-val">Cinema</div>
        </div>
      </div>

      <!-- 6. Sound Mode -->
      <div class="card">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <div>
          <div class="toggle-name">Sound Mode</div>
          <div class="toggle-val">Standard</div>
        </div>
      </div>

      <!-- 7. Sleep Timer -->
      <div class="card">
        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        <div>
          <div class="toggle-name">Sleep Timer</div>
          <div class="toggle-val">Off</div>
        </div>
      </div>

      <!-- 8. Power -->
      <div class="card">
        <svg viewBox="0 0 24 24"><path fill="#D71920" d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A6.92 6.92 0 0 1 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.55 1.37-4.78 3.41-6.02L6.99 4.56A8.962 8.962 0 0 0 3 12c0 4.97 4.02 9 9 9 4.97 0 9-4.03 9-9 0-2.74-1.23-5.18-3.17-6.83z"/></svg>
        <div>
          <div class="toggle-name">Power</div>
          <div class="toggle-val">Standby</div>
        </div>
      </div>
    </div>

    <!-- Volume & All Settings -->
    <div class="bottom-controls">
      <div class="volume-card">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        <div class="volume-track">
          <div class="volume-fill"></div>
        </div>
        <div class="volume-num">32</div>
      </div>
      <div class="all-settings-btn">All settings</div>
    </div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div class="footer-hints">D-PAD Navigate &nbsp;&nbsp;|&nbsp;&nbsp; OK Toggle &nbsp;&nbsp;|&nbsp;&nbsp; BACK Home</div>
    <div class="footer-code">04 / CHAERUL SETTINGS</div>
  </div>

</body>
</html>
